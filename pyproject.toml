[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoslide-jk"
version = "0.1.0"
description = "Terrain Intelligence and Rainfall-Triggered Landslide Risk Decision Support System for Jammu & Kashmir"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "GeoSlide Engineering Team" }
]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
geo = [
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "rasterio>=1.3.0",
    "rioxarray>=0.15.0",
    "xarray>=2023.10.0",
    "netCDF4>=1.6.5",
    "pyogrio>=0.7.0",
]
ml = [
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "shap>=0.43.0",
    "joblib>=1.3.0",
]
api = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
