# GeoSlide-JK Phase 3 Feature Configuration (Gate A Final Draft)
# Status: PROPOSAL — awaiting Gate A approval before execution
# Total unambiguous unique features: 52 (42 predictor features + 10 quality/availability features)

output_dir: "data/processed/features"
feature_table_path: "data/processed/features/jk_feature_table.parquet"

# ============================================================
# A. TERRAIN FEATURES (16)
# ============================================================
terrain:
  source_dem: "data/processed/terrain/jk_elevation_glo30_cog.tif"
  source_slope: "data/processed/terrain/jk_slope_degrees_cog.tif"
  source_aspect: "data/processed/terrain/jk_aspect_degrees_cog.tif"
  resample_method: "bilinear"  # 30m → 100m

  features:
    - name: elevation
      units: m
      dtype: float32
      method: "Resample 30m elevation COG to 100m grid"
      nodata: -9999.0

    - name: slope
      units: degrees
      dtype: float32
      method: "Resample 30m slope COG to 100m grid"
      nodata: -9999.0

    - name: aspect
      units: degrees
      dtype: float32
      method: "Resample 30m aspect COG to 100m grid"
      nodata: -9999.0

    - name: northness
      units: "unitless [-1,1]"
      dtype: float32
      method: "cos(aspect_rad)"
      nodata: -9999.0

    - name: eastness
      units: "unitless [-1,1]"
      dtype: float32
      method: "sin(aspect_rad)"
      nodata: -9999.0

    - name: profile_curvature
      units: "1/m"
      dtype: float32
      method: "Second derivative along max slope direction"
      window: "3x3"
      nodata: -9999.0

    - name: plan_curvature
      units: "1/m"
      dtype: float32
      method: "Second derivative across max slope direction"
      window: "3x3"
      nodata: -9999.0

    - name: tri
      units: m
      dtype: float32
      method: "Mean absolute elevation difference (Riley 1999)"
      window: "3x3"
      nodata: -9999.0

    - name: tpi
      units: m
      dtype: float32
      method: "Cell minus mean of annular neighbourhood"
      window: "11x11"
      nodata: -9999.0

    - name: local_relief
      units: m
      dtype: float32
      method: "Max minus min elevation in circular window"
      radius_m: 500
      nodata: -9999.0

    - name: flow_direction
      units: "D8 code"
      dtype: uint8
      method: "D8 single-flow direction after pit filling via WhiteboxTools"
      nodata: 255
      note: "Intermediate product; used for flow accumulation and TWI"

    - name: flow_accumulation
      units: "cell count"
      dtype: float32
      method: "Cumulative upslope contributing area via WhiteboxTools"
      nodata: -9999.0

    - name: drainage_network
      units: binary
      dtype: uint8
      method: "Threshold flow_accumulation > 1000 cells"
      nodata: 255
      note: "Intermediate product; used for distance to drainage"

    - name: distance_to_drainage
      units: m
      dtype: float32
      method: "Euclidean distance to nearest stream cell"
      nodata: -9999.0

    - name: drainage_density
      units: "km/km²"
      dtype: float32
      method: "Stream length per unit area in moving window"
      radius_m: 500
      nodata: -9999.0

    - name: twi
      units: unitless
      dtype: float32
      method: "ln(specific_catchment_area / tan(slope_rad))"
      nodata: -9999.0

# ============================================================
# B. GEOLOGY AND STRUCTURE FEATURES (10)
# ============================================================
geology:
  sources:
    lithology: "data/processed/vectors/jk_lithology.parquet"
    faults: "data/processed/vectors/jk_faults.parquet"
    thrusts: "data/processed/vectors/jk_thrusts.parquet"
    lineaments: "data/processed/vectors/jk_lineaments.parquet"

  features:
    - name: lithology_class
      units: categorical
      dtype: uint8
      method: "Rasterize polygon to grid using normalized coding table"
      nodata: 255
      coding_table: "outputs/reports/phase_3_lithology_lookup_table.csv"

    - name: engineering_geology_group
      units: categorical
      dtype: uint8
      method: "Map lithology codes to broad engineering groups"
      nodata: 255

    - name: distance_to_fault
      units: m
      dtype: float32
      method: "Euclidean distance to nearest fault line (all types)"
      source_filter: null
      nodata: -9999.0

    - name: distance_to_active_fault
      units: m
      dtype: float32
      method: "Euclidean distance to nearest active fault"
      source_filter: "fault_type == 'active'"
      nodata: -9999.0

    - name: distance_to_thrust
      units: m
      dtype: float32
      method: "Euclidean distance to nearest thrust"
      nodata: -9999.0

    - name: distance_to_lineament
      units: m
      dtype: float32
      method: "Euclidean distance to nearest lineament"
      nodata: -9999.0

    - name: fault_density
      units: "km/km²"
      dtype: float32
      method: "Total fault length per unit area in moving window"
      radius_m: 2500
      nodata: -9999.0

    - name: active_fault_density
      units: "km/km²"
      dtype: float32
      method: "Active fault length per unit area"
      radius_m: 2500
      source_filter: "fault_type == 'active'"
      nodata: -9999.0
      note: "Conditional inclusion — evaluate spatial variance during B7 QA"

    - name: thrust_density
      units: "km/km²"
      dtype: float32
      method: "Thrust length per unit area"
      radius_m: 2500
      nodata: -9999.0

    - name: lineament_density
      units: "km/km²"
      dtype: float32
      method: "Lineament length per unit area"
      radius_m: 2500
      nodata: -9999.0

# ============================================================
