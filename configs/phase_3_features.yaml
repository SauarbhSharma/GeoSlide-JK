# ============================================================
# D. HUMAN INTERVENTION FEATURES (6 - unique, zero duplicate)
# ============================================================
human:
  sources:
    major_roads: "data/processed/vectors/jk_major_roads.parquet"
    nh44: "data/processed/vectors/jk_nh44.parquet"
    settlements: "data/processed/vectors/jk_settlements.parquet"

  features:
    - name: distance_to_road
      units: m
      dtype: float32
      method: "Euclidean distance to nearest road segment"
      nodata: -9999.0

    - name: distance_to_nh44
      units: m
      dtype: float32
      method: "Euclidean distance to NH-44 corridor"
      nodata: -9999.0

    - name: road_density
      units: "km/km²"
      dtype: float32
      method: "Total road length per unit area in moving window"
      radius_m: 500
      nodata: -9999.0

    - name: distance_to_settlement
      units: m
      dtype: float32
      method: "Euclidean distance to nearest settlement"
      nodata: -9999.0

    - name: settlement_density
      units: "count/km²"
      dtype: float32
      method: "Settlement points per unit area in moving window"
      radius_m: 1000
      nodata: -9999.0

    - name: distance_to_major_road
      units: m
      dtype: float32
      method: "Euclidean distance to nearest national/state highway"
      nodata: -9999.0

# ============================================================
# E. DATA QUALITY FEATURES (10)
# ============================================================
quality:
  features:
    - name: dem_availability
      dtype: uint8
      method: "1 where elevation is not NoData"
      nodata: 255

    - name: terrain_availability
      dtype: uint8
      method: "1 where slope AND aspect are not NoData"
      nodata: 255

    - name: lithology_availability
      dtype: uint8
      method: "1 where lithology class is not NoData"
      nodata: 255

    - name: tectonic_availability
      dtype: uint8
      method: "1 where distance to fault is not NoData"
      nodata: 255

    - name: worldcover_availability
      dtype: uint8
      method: "1 where WorldCover class is not NoData"
      nodata: 255

    - name: road_availability
      dtype: uint8
      method: "1 where distance to road is not NoData"
      nodata: 255

    - name: settlement_availability
      dtype: uint8
      method: "1 where distance to settlement is not NoData"
      nodata: 255

    - name: provisional_inventory_support_mask
      dtype: uint8
      method: "1 where landslide inventory spatial support exists (polygon hull + 5km buffer)"
      nodata: 255

    - name: missing_feature_count
      dtype: uint8
      method: "Count of predictor features with NoData at each cell"
      nodata: 255

    - name: data_confidence_class
      dtype: uint8
      method: "0 missing=1(High), 1-2=2(Moderate), 3-5=3(Low), 6+=4(Insufficient)"
      nodata: 255

# ============================================================
